name: macosBlocker

# Generated into a real .xcodeproj by XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Run ./generate.sh from this folder. Then open macosBlocker.xcodeproj.
#
# Before shipping:
#   1. Replace BUNDLE_ID_PREFIX below and APP_GROUP with your own values.
#   2. Set DEVELOPMENT_TEAM (or set it per-target in Xcode signing).
#   3. Request Apple's Family Controls (Distribution) entitlement.

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: ABCDE12345   # <- set your team here or in Xcode
    TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad

packages:
  MacBlocker:
    # The shared Swift package lives one directory up.
    path: ..

targets:
  # ---------------------------------------------------------------- app
  macosBlocker:
    type: application
    platform: iOS
    sources:
      - path: ../XcodeScaffold/macosBlockerApp
      - path: ../XcodeScaffold/Shared
    info:
      path: Info/App-Info.plist
      properties:
        CFBundleDisplayName: macosBlocker
        UILaunchScreen: {}
        NSFamilyControlsUsageDescription: >-
          macosBlocker uses Screen Time to shield the apps, categories, and
          websites you choose to block for yourself.
    entitlements:
      path: ../XcodeScaffold/Entitlements/macosBlockerApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.macosBlocker
    dependencies:
      - package: MacBlocker
        product: MacBlockerAppFeature
      - package: MacBlocker
        product: MacBlockerWebUI
      - package: MacBlocker
        product: MacBlockerCore
      - package: MacBlocker
        product: MacBlockerScreenTime
      - target: macosBlockerDeviceActivityMonitor
      - target: macosBlockerShieldConfiguration
      - target: macosBlockerShieldAction

  # ---------------------------------------- DeviceActivityMonitor extension
  macosBlockerDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ../XcodeScaffold/macosBlockerDeviceActivityMonitor
      - path: ../XcodeScaffold/Shared
    info:
      path: Info/DeviceActivityMonitor-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: ../XcodeScaffold/Entitlements/macosBlockerExtensions.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.macosBlocker.DeviceActivityMonitor
    dependencies:
      - package: MacBlocker
        product: MacBlockerCore
      - package: MacBlocker
        product: MacBlockerScreenTime

  # ---------------------------------------- ShieldConfiguration extension
  macosBlockerShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ../XcodeScaffold/macosBlockerShieldConfiguration
    info:
      path: Info/ShieldConfiguration-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ../XcodeScaffold/Entitlements/macosBlockerExtensions.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.macosBlocker.ShieldConfiguration

  # ---------------------------------------- ShieldAction extension
  macosBlockerShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ../XcodeScaffold/macosBlockerShieldAction
      - path: ../XcodeScaffold/Shared
    info:
      path: Info/ShieldAction-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ../XcodeScaffold/Entitlements/macosBlockerExtensions.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.macosBlocker.ShieldAction
    dependencies:
      - package: MacBlocker
        product: MacBlockerCore
