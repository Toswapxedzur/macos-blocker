name: macosBlocker

# Generated into a real .xcodeproj by XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Run ./generate.sh from this folder. Then open macosBlocker.xcodeproj.
#
# Before shipping: set DEVELOPMENT_TEAM (or set it per-target in Xcode signing).
# The iPhone app and its Screen Time extensions were retired on 2026-09-26.

options:
  bundleIdPrefix: com.adamancia.vault
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9KCD8QL2LN

packages:
  MacBlocker:
    # The shared Swift package lives one directory up.
    path: ..

# XcodeGen REWRITES each entitlements file from the `properties` listed beside its
# path (an entry with no properties is emptied), so the properties here are the
# source of truth for XcodeScaffold/Entitlements/*.
targets:
  # --------------------------------------------------------- macOS App Store app
  AdamanciaVaultMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ../Sources/MacBlockerPanel
    info:
      path: Info/AdamanciaVaultMac-Info.plist
      properties:
        CFBundleDisplayName: Adamancia Vault
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
    entitlements:
      path: ../XcodeScaffold/Entitlements/AdamanciaVaultMacStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_NAME: AdamanciaVault
        PRODUCT_BUNDLE_IDENTIFIER: com.adamancia.vault.mac
        # This target imports MacBlockerAppFeature, which reaches the classifier's
        # llama.cpp module; llama.h needs the shared Homebrew include root (the
        # same rule as Package.swift). Apple Silicon prefix.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -I/opt/homebrew/include"
    dependencies:
      - package: MacBlocker
        product: MacBlockerAppFeature
