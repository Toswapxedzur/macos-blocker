<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Classifier autosave regression</title>
<link rel="stylesheet" href="/Sources/MacBlockerWebUI/WebAssets/vault-ui.css">
<style>html,body,#host{height:100%;margin:0}#host{display:block}</style><div id="host"></div>
<script>
const scope = document.getElementById('host').attachShadow({mode:'open'});
scope.innerHTML = '<link rel="stylesheet" href="/Sources/MacBlockerWebUI/WebAssets/vault-ui.css"><link rel="stylesheet" href="/classifier/Sources/VaultClassifierApp/WebAssets/app.css"><div id="app"></div>';
window.VaultScenes = {scope:()=>scope};
window.uiErrors=[];
window.addEventListener('error',e=>uiErrors.push(e.message));
window.testState = {
  presentationRevision:1,workspace:'browserBridge',issue:null,notices:{},
  settings:{packageUpdateMode:'automatic',localModels:{modelLibrary:[]},research:{enabled:false,llmProviderProfileID:'',llmModelIdentifier:'',status:{}}},
  backup:{unlocked:true,hasOwnerCode:true,enabled:false,savedEnabled:false,directory:'/tmp/test-backups'},
  assets:{classifierTypes:[{id:'group-1',name:'Test group',treeID:'tree-1',applicablePlatformIDs:['youtube'],localModel:{speedQuality:'balanced',strictness:3,houseRules:''},researchEnabled:null,order:0}],
    trees:[{id:'tree-1',name:'Test tags',nodes:[{id:'tag-1',name:'Science',description:'',parentID:null,positionX:24,positionY:24}]}],datasets:[],
    collectionPlatforms:[{id:'youtube',name:'YouTube',supportsLocalModel:true}],bindings:[],
    knowledge:{creators:[],terms:[{id:'term-1',subject:'Physics',meaning:'Original meaning',writtenByUser:true}],knownCreators:[]},
    providerProfiles:[{id:'provider-1',name:'Test provider',type:'openAI',customEndpoint:'',testModelIdentifier:'',credential:'',hasCredential:false,protocolConfiguration:{}}],
    providerProtocols:{openAI:{supportsGenerateText:true,supportsLLMConfiguration:true,supportsNativeWebSearch:true,credentialRequired:true,allowsEndpointOverride:true,configurationRequirements:[]}},
    providerRequestRecords:[],providerModelCatalogs:{},loadingProviderModelProfileIDs:[],providerModelCatalogErrors:{}}
};
window.commands=[];window.ackDelay=0;
window.modelFetchDelay=100;window.modelFetchError=null;
window.modelFetchResults={'provider-1':['test-model','test-grounded-model']};
window.pushSnapshot=()=>{testState.presentationRevision++;VaultClassifier.receive(structuredClone(testState));};
window.webkit={messageHandlers:{vaultClassifier:{postMessage(message){
  commands.push(structuredClone(message));
  const {action,data}=message, type=testState.assets.classifierTypes.find(t=>t.id===data.typeID);
  switch(action){
    case 'confirmDeleteClassifierType':testState.assets.classifierTypes=testState.assets.classifierTypes.filter(t=>t.id!==data.typeID);break;
    case 'configureClassifierType':type.name=data.name.trim();break;
    case 'saveClassifierTypeLocalModel':type.localModel={speedQuality:data.speedQuality,strictness:Number(data.strictness),houseRules:data.houseRules||''};break;
    case 'saveClassifierTypeResearch':type.researchEnabled=data.researchMode==='inherit'?null:data.researchMode==='on';break;
    case 'saveResearchSettings':Object.assign(testState.settings.research,data);break;
    case 'savePackageSettings':testState.settings.packageUpdateMode=data.packageUpdateMode;break;
    case 'updateTag':Object.assign(testState.assets.trees[0].nodes[0],data);break;
    case 'editKnowledgeEntry':testState.assets.knowledge.terms[0].meaning=data.meaning;break;
    case 'updateProviderConnection':Object.assign(testState.assets.providerProfiles.find(p=>p.id===data.profileID),data,{hasCredential:!!data.credential});break;
    case 'saveBackup':Object.assign(testState.backup,data);break;
    case 'probeProviderModelCatalog': {
      const profileID=data.profileID;
      testState.assets.loadingProviderModelProfileIDs.push(profileID);
      delete testState.assets.providerModelCatalogErrors[profileID];
      pushSnapshot();
      setTimeout(()=>{
        if(modelFetchError) testState.assets.providerModelCatalogErrors[profileID]=modelFetchError;
        else testState.assets.providerModelCatalogs[profileID]=modelFetchResults[profileID]||[];
        testState.assets.loadingProviderModelProfileIDs=testState.assets.loadingProviderModelProfileIDs.filter(id=>id!==profileID);
        pushSnapshot();
      },modelFetchDelay);
      return;
    }
    case 'createProviderProfile':testState.assets.providerProfiles.push({id:'provider-created',name:'New provider',type:data.type,credential:'',hasCredential:false,protocolConfiguration:{}});break;
    case 'workspace':testState.workspace=data.workspace;break;
    case 'state':break;
    default:return;
  }
  const snapshot=structuredClone(testState);
  setTimeout(()=>{snapshot.presentationRevision=++testState.presentationRevision;VaultClassifier.receive(snapshot)},ackDelay);
}}}};
</script>
<script src="/Sources/MacBlockerWebUI/WebAssets/vault-ui.js"></script>

<script>
window.runAutosaveTests=async()=>{
  const results=[],q=s=>scope.querySelector(s);
  const expect=(condition,label)=>{if(!condition)throw Error(label);results.push('PASS '+label)};
  const poll=async(predicate)=>{const until=performance.now()+5000;while(!predicate()){if(performance.now()>until)throw Error('Timed out');await new Promise(r=>setTimeout(r,20))}};
  const input=(selector,value)=>{const c=q(selector);if(!c)throw Error('Missing '+selector);c.focus();c.value=value;c.dispatchEvent(new InputEvent('input',{bubbles:true}));return c};
  const change=(selector,value)=>{const c=q(selector);if(!c)throw Error('Missing '+selector);c.value=value;c.dispatchEvent(new Event('change',{bubbles:true}));return c};
  const count=action=>commands.filter(c=>c.action===action).length;
  const name='[data-form-id="classifier-type-group-1"] [data-field="name"]';
  await poll(()=>q('[data-action="selectType"]'));q('[data-action="selectType"]').click();
  const more='[data-expand="type-more:group-1"]';
  const knowledge=q('[data-workspace="knowledge"]');
  expect(knowledge.getClientRects().length && !knowledge.closest('details') && !q('.sidebar-more'),'Knowledge is directly visible without a sidebar More');
  expect(!q(more).open && q(more+' summary').textContent.includes('Balanced') && !q('[data-field="houseRules"]').checkVisibility(),'independent group dials start collapsed with a visible status');
  q(more+' summary').click();await poll(()=>q(more).open);await new Promise(r=>setTimeout(r,0));
  expect(!q('[data-action="configureClassifierType"], [data-action="saveClassifierTypeLocalModel"], [data-action="saveClassifierTypeResearch"]'),'group has no Save buttons');
  ackDelay=450;
  input(name,'First name');await poll(()=>count('configureClassifierType')===1);
  const text=input(name,'Latest name');text.setSelectionRange(3,7);
  pushSnapshot();
  expect(q(name).value==='Latest name' && scope.activeElement===q(name) && q(name).selectionStart===3 && q(name).selectionEnd===7,'snapshot preserves pending text, focus and caret');
  expect(q(more).open,'incoming snapshot keeps group More expanded');
  await poll(()=>count('configureClassifierType')===2);
  await poll(()=>scope.querySelector('.sidebar-name')?.textContent==='Latest name');
  expect(q(name).value==='Latest name','older save response cannot overwrite newer text');
  ackDelay=0;
  const local='[data-form-id="classifier-local-model-form-group-1"] ';
  input(local+'[data-field="houseRules"]','Keep my vocabulary');
  const strict=q(local+'[data-field="strictness"][value="4"]');strict.checked=true;strict.dispatchEvent(new Event('change',{bubbles:true}));
  expect(commands.at(-1).action==='saveClassifierTypeLocalModel' && commands.at(-1).data.houseRules==='Keep my vocabulary','dial saves immediately with the current house-rule draft');
  await poll(()=>testState.assets.classifierTypes[0].localModel.strictness===4);
  testState.assets.classifierTypes.push({id:'group-2',name:'Other group',treeID:'tree-1',applicablePlatformIDs:['reddit'],localModel:{speedQuality:'best',strictness:1,houseRules:'Other rules'},researchEnabled:null,order:1});pushSnapshot();
  q('[data-action="selectType"][data-type-id="group-2"]').click();
  q('[data-expand="type-more:group-2"] summary').click();
  const other=q('[data-form-id="classifier-local-model-form-group-2"] [data-field="speedQuality"][value="fast"]');
  other.checked=true;other.dispatchEvent(new Event('change',{bubbles:true}));
  await poll(()=>testState.assets.classifierTypes[1].localModel.speedQuality==='fast');
  expect(testState.assets.classifierTypes[0].localModel.speedQuality==='balanced' && testState.assets.classifierTypes[0].localModel.houseRules==='Keep my vocabulary' && testState.assets.classifierTypes[1].localModel.strictness===1, 'editing another group changes only its own dial and preserves both groups rules');
  q('[data-action="selectType"][data-type-id="group-1"]').click();
  testState.assets.classifierTypes.pop();pushSnapshot();

  change('[data-form-id="classifier-research-form-group-1"] [data-field="researchMode"]','off');
  expect(commands.at(-1).action==='saveClassifierTypeResearch','group research saves immediately');
  await poll(()=>q(more+' summary').textContent.includes('Custom house rules') && q(more+' summary').textContent.includes('Grounded research: Off'));
  q(more+' summary').click();await new Promise(r=>setTimeout(r,0));pushSnapshot();
  expect(!q(more).open && q(more+' summary').textContent.includes('Strict') && q(more+' summary').getClientRects().length,'collapsed More retains the active override summary across snapshots');
  q(more+' summary').click();await new Promise(r=>setTimeout(r,0));
  q('[data-action="openUtilityPanel"]').click();
  expect(!q('[data-form-id="utility-llm-form"]') && !q('.utility-settings-modal [data-field="strictness"]'), 'Settings contains no global dial controls');
  change('[data-form-id="utility-research-form"] [data-field="llmProviderProfileID"]','provider-1');
  testState.assets.providerModelCatalogs['provider-1']=['test-model'];pushSnapshot();
  await poll(()=>q('[data-model-selector]'));q('[data-model-selector]').click();q('[data-model-pick="test-model"]').click();
  await poll(()=>testState.settings.research.llmModelIdentifier==='test-model');
  expect(testState.settings.research.llmProviderProfileID==='provider-1','global research provider and model autosave');
  change('[data-form-id="utility-package-form"] [data-field="packageUpdateMode"]','manual');
  expect(testState.settings.packageUpdateMode==='manual','package-update choice autosaves');
  expect(!q('[data-action^="save"]'),'settings have no Save buttons');
  q('[data-action="closeUtilityPanel"]').click();
  q('[data-action="workspace"][data-workspace="knowledge"]').click();
  input('[data-id="term-1"] [data-field="meaning"]','Updated meaning');
  await poll(()=>testState.assets.knowledge.terms[0].meaning==='Updated meaning');
  expect(!q('[data-action="editKnowledgeEntry"]') && !!q('[data-action="addKnowledgeTerm"]'),'knowledge edits autosave and creation stays explicit');
  q('[data-action="openUtilityPanel"]').click();
  input('[data-provider-id="provider-1"] [data-field="customEndpoint"]','https://example.test/api');
  await poll(()=>testState.assets.providerProfiles[0].customEndpoint==='https://example.test/api');
  expect(!!q('[data-action="testProviderProfile"]'),'provider edits autosave and Probe stays explicit');
  testState.assets.providerProfiles[0].credential='synthetic-old-key';pushSnapshot();
  ackDelay=450;
  input('[data-provider-id="provider-1"] [data-field="credential"]','synthetic-new-key');
  await poll(()=>commands.at(-1).data.credential==='synthetic-new-key');
  const stale=structuredClone(testState);stale.assets.providerProfiles[0].credential='synthetic-old-key';
  VaultClassifier.receive(stale);pushSnapshot();
  expect(q('[data-provider-id="provider-1"] [data-field="credential"]').value==='synthetic-new-key','older snapshot cannot acknowledge a different credential');
  await new Promise(r=>setTimeout(r,500));ackDelay=0;
  q('[data-action="closeUtilityPanel"]').click();
  q('[data-action="selectType"]').click();
  q('[data-node-id="tag-1"]').dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,composed:true}));
  input('[data-tree-popover] [data-field="description"]','Tag explanation');
  q('[data-action="cancelTagPanel"]').click();
  expect(testState.assets.trees[0].nodes[0].description==='Tag explanation','closing the tag editor flushes its text');
  const ime=input(name,'Before composition');
  ime.dispatchEvent(new CompositionEvent('compositionstart',{bubbles:true}));
  ime.value='中文分组';ime.dispatchEvent(new InputEvent('input',{bubbles:true,isComposing:true}));
  pushSnapshot();
  expect(q(name)===ime && q(name).value==='中文分组','snapshot does not replace an active composition');
  ime.dispatchEvent(new CompositionEvent('compositionend',{bubbles:true}));
  await poll(()=>testState.assets.classifierTypes[0].name==='中文分组');
  q('[data-action="newType"]').click();
  const createName='[data-create-type-name]';
  expect(scope.activeElement===q(createName) && q('[data-create-type-dialog]').getAttribute('aria-label'), 'creation dialog has a name and initial focus');
  const creation=input(createName,'Unfinished group');creation.setSelectionRange(4,9);
  testState.issue='Synthetic incoming status';pushSnapshot();
  expect(q(createName).value==='Unfinished group' && scope.activeElement===q(createName) && q(createName).selectionStart===4 && q(createName).selectionEnd===9,'creation draft and focus survive snapshots');
  const card=q('[data-create-type-dialog]');
  const controls=Array.from(card.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(c=>!c.disabled && c.getClientRects().length);
  controls.at(-1).focus();controls.at(-1).dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true,composed:true}));
  expect(scope.activeElement===controls[0],'Tab wraps inside creation dialog');
  controls[0].dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',shiftKey:true,bubbles:true,cancelable:true,composed:true}));
  expect(scope.activeElement===controls.at(-1),'Shift Tab wraps inside creation dialog');
  scope.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true,composed:true}));
  expect(!q('[data-create-type-dialog]') && scope.activeElement===q('[data-action="newType"]'),'Escape closes creation and returns focus');
  q('[data-action="openUtilityPanel"]').click();
  scope.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true,composed:true}));
  expect(!q('.utility-popover') && scope.activeElement===q('[data-action="openUtilityPanel"]'),'Escape closes settings and returns focus');
  testState.issue=null;pushSnapshot();
  const dialForm=q('[data-form-id="classifier-local-model-form-group-1"]');
  expect(dialForm.querySelectorAll('[data-field="speedQuality"]').length===3 && dialForm.querySelectorAll('[data-field="strictness"]').length===5, 'each group contains all model tier cards and strictness positions');
  expect(!dialForm.querySelector('option[value=""]'), 'group dials have no global inheritance choice');
  testState.trash=[{id:'retired-trash',name:'Deleted group',kind:'classifierType'}];pushSnapshot();
  expect(!q('[data-expand="trash"], [data-action="selectTrash"], [data-action="restoreTrashedEntry"]'),'obsolete Trash snapshots produce no controls');
  const deletion='[data-action="confirmDeleteClassifierType"][data-type-id="group-1"]';
  q(deletion).click();
  expect(count('confirmDeleteClassifierType')===0 && testState.assets.classifierTypes.length===1,'first delete click only arms confirmation');
  q(deletion).click();await poll(()=>!q('[data-action="selectType"][data-type-id="group-1"]'));
  expect(count('confirmDeleteClassifierType')===1 && testState.assets.classifierTypes.length===0,'second delete click removes the group without a restore panel');
  expect(uiErrors.length===0,'no browser errors');
  return results;
};
</script>
